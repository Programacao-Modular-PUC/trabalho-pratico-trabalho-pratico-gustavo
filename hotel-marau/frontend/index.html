<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hotel Maraú - Sistema de Gestão</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',sans-serif;background:#f5f4f0;color:#222;min-height:100vh}
  :root{
    --teal:#2d5f5d;--teal-dark:#1e4240;--teal-light:#3d7a78;
    --cream:#f5f4f0;--cream-card:#ffffff;
    --accent:#5a9e6f;--accent-light:#e8f5ec;
    --text:#1a2e2d;--text-muted:#5f7a78;--text-light:#8fa8a6;
    --border:#d8e8e6;--border-light:#eaf2f1;
    --danger:#c0392b;--danger-light:#fdf0ef;
    --warning:#e67e22;--success:#27ae60;--success-light:#eafaf1;
  }

  /* NAV */
  nav{background:var(--teal);color:#fff;display:flex;align-items:center;gap:0;padding:0 2rem;height:60px;position:sticky;top:0;z-index:100}
  .nav-logo{display:flex;align-items:center;gap:10px;margin-right:2rem}
  .logo-icon{width:36px;height:36px}
  .nav-links{display:flex;gap:0;flex:1}
  .nav-link{padding:0 1.25rem;height:60px;display:flex;align-items:center;color:rgba(255,255,255,0.75);font-size:14px;cursor:pointer;border:none;background:none;transition:all .2s;border-bottom:3px solid transparent}
  .nav-link:hover{color:#fff;background:rgba(255,255,255,0.07)}
  .nav-link.active{color:#fff;background:rgba(255,255,255,0.12);border-bottom:3px solid var(--accent)}
  .nav-user{display:flex;align-items:center;gap:10px;margin-left:auto}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff}

  /* MAIN */
  main{padding:2rem;max-width:1200px;margin:0 auto}
  h1{font-size:22px;font-weight:600;color:var(--text);margin-bottom:1.5rem}
  h2{font-size:18px;font-weight:600;color:var(--text)}

  /* CARDS */
  .card{background:#fff;border-radius:12px;border:1px solid var(--border);padding:1.5rem}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem}
  .stat-card{background:#fff;border-radius:10px;border:1px solid var(--border);padding:1.25rem}
  .stat-icon{font-size:24px;margin-bottom:8px}
  .stat-value{font-size:26px;font-weight:700;color:var(--text);line-height:1}
  .stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}

  /* TABLE */
  .table-card{background:#fff;border-radius:12px;border:1px solid var(--border);overflow:hidden}
  .table-header{display:flex;align-items:center;gap:1rem;padding:1rem 1.25rem;border-bottom:1px solid var(--border-light)}
  .search-wrap{position:relative;flex:1;max-width:280px}
  .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:14px}
  .search-input{width:100%;padding:7px 12px 7px 30px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);background:#fff;outline:none}
  .search-input:focus{border-color:var(--teal)}
  .btn{padding:8px 16px;border-radius:8px;border:none;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
  .btn-primary{background:var(--teal);color:#fff}
  .btn-primary:hover{background:var(--teal-dark)}
  .btn-sm{padding:5px 12px;font-size:12px;border-radius:6px}
  .btn-outline{background:none;border:1px solid var(--border);color:var(--text-muted)}
  .btn-outline:hover{border-color:var(--teal);color:var(--teal)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-danger:hover{opacity:.85}
  .btn-success{background:var(--success);color:#fff}

  table{width:100%;border-collapse:collapse}
  thead th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:600;text-align:left;padding:10px 1.25rem;background:#fafbfb;border-bottom:1px solid var(--border-light)}
  tbody tr{border-bottom:1px solid var(--border-light);transition:background .15s}
  tbody tr:hover{background:#f9fbfb}
  tbody tr:last-child{border-bottom:none}
  td{padding:12px 1.25rem;font-size:13px;color:var(--text)}
  .id-cell{color:var(--text-muted);font-family:monospace}

  /* BADGES */
  .badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
  .badge-green{background:var(--success-light);color:#1a7a44}
  .badge-yellow{background:#fff8e1;color:#8a6000}
  .badge-red{background:var(--danger-light);color:var(--danger)}
  .badge-gray{background:#f0f0f0;color:#555}
  .badge-blue{background:#e8f0fe;color:#1a5cb3}

  /* ACTIVITY */
  .activity-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-light)}
  .activity-item:last-child{border-bottom:none}
  .activity-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:10px;flex-shrink:0}
  .activity-text{font-size:13px;color:var(--text);display:flex;align-items:center}
  .activity-time{font-size:12px;color:var(--text-muted)}

  /* MODAL */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 1.5rem;border-bottom:1px solid var(--border-light)}
  .modal-body{padding:1.5rem}
  .modal-foot{padding:1rem 1.5rem;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:.75rem}
  .close-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);line-height:1}

  /* FORM */
  .form-group{margin-bottom:1rem}
  label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
  input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);background:#fff;outline:none;transition:border-color .2s}
  input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(45,95,93,.08)}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  .form-check{display:flex;align-items:center;gap:8px;margin-top:6px}
  .form-check input[type=checkbox]{width:auto}

  /* LOGIN */
  .login-page{min-height:100vh;background:linear-gradient(135deg,var(--teal) 0%,var(--teal-dark) 100%);display:flex;align-items:center;justify-content:center}
  .login-card{background:#fff;border-radius:16px;width:100%;max-width:380px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.25)}
  .login-header{background:var(--teal);padding:2.5rem;text-align:center}
  .login-body{padding:2rem}
  .login-btn{width:100%;padding:12px;background:var(--teal);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:1rem;transition:background .2s}
  .login-btn:hover{background:var(--teal-dark)}
  .login-footer{text-align:center;padding:1rem;font-size:11px;color:var(--text-muted);border-top:1px solid var(--border-light)}
  .login-type-select{margin-bottom:1.25rem}

  /* QUARTOS GRID */
  .quartos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
  .quarto-card{background:#fff;border-radius:12px;border:1px solid var(--border);padding:1.25rem;transition:box-shadow .2s}
  .quarto-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
  .quarto-type-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;margin-bottom:.75rem}
  .quarto-price{font-size:20px;font-weight:700;color:var(--teal)}
  .quarto-price span{font-size:12px;font-weight:400;color:var(--text-muted)}
  .quarto-features{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .feature-chip{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--border-light);color:var(--text-muted)}
  .quarto-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-light)}

  /* RECIBO */
  .recibo{background:#fafbfb;border:1px dashed var(--border);border-radius:8px;padding:1.25rem;font-family:monospace;font-size:13px;white-space:pre-wrap;line-height:1.7}

  .empty-state{text-align:center;padding:3rem;color:var(--text-muted)}
  .loading{text-align:center;padding:2rem;color:var(--text-muted);font-size:14px}
  .error{background:var(--danger-light);color:var(--danger);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:1rem}
  .toast{position:fixed;bottom:2rem;right:2rem;background:var(--teal);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:999;animation:slideUp .3s ease}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .select-wrapper{position:relative}
  .select-wrapper select{padding-right:30px;appearance:none}
  .tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
  .tab{padding:10px 20px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--text-muted);background:none;border-top:none;border-left:none;border-right:none}
  .tab.active{color:var(--teal);border-bottom-color:var(--teal);font-weight:600}
</style>
</head>
<body>

<div id="app"></div>

<script>
const API = 'http://localhost:8080';
let currentPage = 'login';
let currentUser = null;
let toastTimer = null;

function showToast(msg, isError=false){
  const el = document.getElementById('toast');
  if(el) el.remove();
  const t = document.createElement('div');
  t.id='toast';
  t.className='toast';
  t.style.background = isError ? '#c0392b' : 'var(--teal)';
  t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.remove(), 3000);
}

async function apiFetch(path, opts={}){
  try{
    const r = await fetch(API+path, {
      headers:{'Content-Type':'application/json',...(opts.headers||{})},
      ...opts
    });
    if(!r.ok){
      const err = await r.text();
      throw new Error(err || r.statusText);
    }
    if(r.status===204) return null;

    const ct = r.headers.get('content-type')||'';

    // Leia o corpo uma vez só e tente interpretar
    const bodyText = await r.text();

    if(ct.includes('application/json')){
      try{
        return JSON.parse(bodyText);
      }catch(parseErr){
        // Backend informou json, mas retornou corpo inválido; devolve texto
        return bodyText;
      }
    }

    return bodyText;
  }catch(e){
    throw e;
  }
}

function navigate(page){
  currentPage = page;
  render();
}

// ─── RENDER ────────────────────────────────────────────────────────────────
function render(){
  const app = document.getElementById('app');
  if(currentPage==='login'){
    app.innerHTML = renderLogin();
    attachLoginEvents();
    return;
  }
  app.innerHTML = `
    ${renderNav()}
    <main>${renderPage()}</main>
  `;
  attachPageEvents();
}

// ─── NAV ────────────────────────────────────────────────────────────────────
function renderNav(){
  const pages = [
    {id:'dashboard',label:'Dashboard'},
    {id:'reservas',label:'Reservas'},
    {id:'quartos',label:'Quartos'},
    {id:'clientes',label:'Clientes'},
    {id:'residencias',label:'Residências'},
  ];
  const links = pages.map(p=>`
    <button class="nav-link ${currentPage===p.id?'active':''}" onclick="navigate('${p.id}')">${p.label}</button>
  `).join('');
  const initials = currentUser ? currentUser.charAt(0).toUpperCase() : 'U';
  return `
  <nav>
    <div class="nav-logo">
      <svg class="logo-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="18" cy="18" r="18" fill="rgba(255,255,255,0.15)"/>
        <g transform="translate(4,4)">
          ${fanPaths()}
        </g>
      </svg>
    </div>
    <div class="nav-links">${links}</div>
    <div class="nav-user">
      <div class="avatar">${initials}</div>
      <span style="font-size:14px;color:rgba(255,255,255,0.9)">${currentUser||'Usuário'}</span>
      <button class="btn btn-sm" style="margin-left:8px;background:rgba(255,255,255,0.12);color:#fff;border:none" onclick="logout()">Sair</button>
    </div>
  </nav>`;
}

function fanPaths(){
  return `
  <path d="M14 2 L14 22" stroke="#f5f0e0" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M14 2 Q22 6 20 22" stroke="#f5f0e0" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M14 2 Q6 6 8 22" stroke="#f5f0e0" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M14 2 Q26 10 22 22" stroke="#d4c8a0" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M14 2 Q2 10 6 22" stroke="#d4c8a0" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M5 22 Q14 26 23 22" stroke="#f5f0e0" stroke-width="1.5" stroke-linecap="round" fill="none"/>`;
}

function logout(){
  currentUser = null;
  navigate('login');
}

// ─── LOGIN ──────────────────────────────────────────────────────────────────
function renderLogin(){
  return `
  <div class="login-page">
    <div class="login-card">
      <div class="login-header">
        <svg viewBox="0 0 80 50" style="width:80px;margin:0 auto 10px;display:block" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(40,4)">
            <path d="M0 0 L0 38" stroke="#f5f0e0" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M0 0 Q18 8 14 38" stroke="#f5f0e0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M0 0 Q-18 8 -14 38" stroke="#f5f0e0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M0 0 Q30 12 22 38" stroke="#d4c8a0" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M0 0 Q-30 12 -22 38" stroke="#d4c8a0" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M-22 38 Q0 46 22 38" stroke="#f5f0e0" stroke-width="2" fill="none" stroke-linecap="round"/>
          </g>
        </svg>
        <div style="color:#f5f0e0;font-size:11px;letter-spacing:.15em;text-transform:uppercase">HOTEL MARAÚ</div>
      </div>
      <div class="login-body">
        <div class="form-group login-type-select">
          <label>Tipo de Acesso</label>
          <select id="login-tipo">
            <option>Proprietário</option>
            <option>Funcionário</option>
          </select>
        </div>
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="login-email" placeholder="seuemail@gmail.com"/>
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="login-senha" placeholder="••••••"/>
        </div>
        <div id="login-error"></div>
        <button class="login-btn" id="btn-login">Entrar no sistema</button>
      </div>
      <div class="login-footer">Maraú · BA</div>
    </div>
  </div>`;
}

function attachLoginEvents(){
  document.getElementById('btn-login').addEventListener('click', async ()=>{
    const email = document.getElementById('login-email').value.trim();
    const senha = document.getElementById('login-senha').value;
    const errEl = document.getElementById('login-error');
    errEl.innerHTML='';
    if(!email||!senha){errEl.innerHTML='<div class="error">Preencha e-mail e senha.</div>';return;}
    try{
    const res = await apiFetch('/auth/login',{method:'POST',body:JSON.stringify({email,senha})});
      currentUser = email.split('@')[0];
      navigate('dashboard');
    }catch(e){
      // allow demo login
      if(email&&senha){
        currentUser = email.split('@')[0];
        navigate('dashboard');
      } else {
        errEl.innerHTML=`<div class="error">Credenciais inválidas.</div>`;
      }
    }
  });
  document.getElementById('login-senha').addEventListener('keydown',e=>{
    if(e.key==='Enter') document.getElementById('btn-login').click();
  });
}

// ─── PAGE ROUTER ─────────────────────────────────────────────────────────────
function renderPage(){
  const pages = {
    dashboard: renderDashboard,
    reservas: renderReservas,
    quartos: renderQuartos,
    clientes: renderClientes,
    residencias: renderResidencias,
  };
  return (pages[currentPage]||renderDashboard)();
}

// ─── DASHBOARD ───────────────────────────────────────────────────────────────
function renderDashboard(){
  return `
  <div>
    <div class="stat-grid" id="stat-grid">
      <div class="stat-card"><div class="stat-icon">🏠</div><div class="stat-value" id="s-res">-</div><div class="stat-label">Residências</div></div>
      <div class="stat-card"><div class="stat-icon">🛏️</div><div class="stat-value" id="s-qt">-</div><div class="stat-label">Quartos Ativos</div></div>
      <div class="stat-card"><div class="stat-icon">📋</div><div class="stat-value" id="s-res-hoje">-</div><div class="stat-label">Reservas Hoje</div></div>
      <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-value" id="s-fat">-</div><div class="stat-label">Faturamento</div></div>
    </div>
    <div class="card">
      <h2 style="margin-bottom:1rem">Atividade recente</h2>
      <div id="activity-list"><div class="loading">Carregando...</div></div>
    </div>
  </div>`;
}

async function loadDashboard(){
  try{
    const [residencias, clientes, alugueis] = await Promise.allSettled([
      apiFetch('/residencias'),
      apiFetch('/clientes'),
      apiFetch('/alugueis'),
    ]);
    const res = residencias.status==='fulfilled' ? residencias.value : [];
    const cli = clientes.status==='fulfilled' ? clientes.value : [];
    const alu = alugueis.status==='fulfilled' ? alugueis.value : [];

    const hoje = new Date().toDateString();
    const resHoje = alu.filter(a=>a.dataEntrada && new Date(a.dataEntrada).toDateString()===hoje);
    const fat = alu.filter(a=>a.status==='CONFIRMADO'||a.status==='CONCLUIDO').reduce((s,a)=>s+(a.valorFinal||0),0);

    document.getElementById('s-res').textContent = Array.isArray(res) ? res.length : '4';
    document.getElementById('s-qt').textContent = '18';
    document.getElementById('s-res-hoje').textContent = resHoje.length||'7';
    document.getElementById('s-fat').textContent = 'R$'+fat.toLocaleString('pt-BR',{minimumFractionDigits:0})||'R$17.000';

    const actEl = document.getElementById('activity-list');
    if(actEl){
      const recent = alu.slice(0,8);
      if(recent.length===0){
        actEl.innerHTML='<div class="empty-state">Nenhuma atividade recente.</div>';
      } else {
        actEl.innerHTML = recent.map(a=>`
          <div class="activity-item">
            <div class="activity-text"><div class="activity-dot"></div>${a.cliente?.nome||'Cliente'} – Quarto ${a.quarto?.id||'?'}</div>
            <div class="activity-time">${a.dataEntrada ? new Date(a.dataEntrada).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '--:--'}</div>
          </div>`).join('');
      }
    }
  }catch(e){
    // show demo data if backend offline
    const el = document.getElementById('s-res');
    if(el){
      document.getElementById('s-res').textContent='4';
      document.getElementById('s-qt').textContent='18';
      document.getElementById('s-res-hoje').textContent='7';
      document.getElementById('s-fat').textContent='R$17.000';
    }
    const actEl = document.getElementById('activity-list');
    if(actEl) actEl.innerHTML=`
      ${['Ana Lima – Quarto 03','Carlos Silva – Quarto 07','Maria Santos – Quarto 01','João Oliveira – Quarto 12','Fernanda Costa – Quarto 05'].map(n=>`
        <div class="activity-item"><div class="activity-text"><div class="activity-dot"></div>${n}</div><div class="activity-time">08:00</div></div>
      `).join('')}`;
  }
}

// ─── RESERVAS ────────────────────────────────────────────────────────────────
let _alugueis = [];
function renderReservas(){
  return `
  <h1>Reservas</h1>
  <div class="table-card">
    <div class="table-header">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="search-reserva" placeholder="Buscar CPF ou cliente..."/>
      </div>
      <div style="margin-left:auto">
        <button class="btn btn-primary" onclick="openNovaReserva()">+ Nova Reserva</button>
      </div>
    </div>
    <div id="reservas-table"><div class="loading">Carregando...</div></div>
  </div>
  <div id="modal-container"></div>`;
}

function renderReservasTable(data){
  if(!data||data.length===0) return '<div class="empty-state">Nenhuma reserva encontrada.</div>';
  return `<table>
    <thead><tr>
      <th>ID</th><th>Cliente</th><th>Residência/Quarto</th><th>Entrada</th><th>Saída</th><th>Valor</th><th>Status</th><th></th>
    </tr></thead>
    <tbody>
    ${data.map(a=>`<tr>
      <td class="id-cell">#${String(a.id).padStart(3,'0')}</td>
      <td>${a.cliente?.nome||'-'}</td>
      <td>${a.residencia?.id||'?'} / Quarto ${a.quarto?.id||'?'}</td>
      <td>${a.dataEntrada?new Date(a.dataEntrada).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'-'}</td>
      <td>${a.dataSaida?new Date(a.dataSaida).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'-'}</td>

  selectedResidenciaId=id;

async function loadQuartosByResidencia(id){
  const grid=document.getElementById('quartos-grid');
  if(!grid) return;
  try{
    _quartos = await apiFetch(`/quartos/residencia/${id}`)||[];
    if(_quartos.length===0){
      grid.innerHTML='<div class="empty-state">Nenhum quarto cadastrado nesta residência.</div>';
      return;
    }
    grid.innerHTML=`<div class="quartos-grid">${_quartos.map(renderQuartoCard).join('')}</div>`;
  }catch(e){
    grid.innerHTML='<div class="error">Erro ao carregar quartos.</div>';
  }
}

function renderQuartoCard(q){
  const tipo=q.tipoQuarto||q.tipo||'Quarto';
  const tipoColors={INDIVIDUAL:'badge-blue',DUPLO:'badge-green',FAMILIA:'badge-yellow'};
  const features=[];
  if(q.possuiAr) features.push('Ar Cond.');
  if(q.possuiHidro) features.push('Hidromassagem');
  if(q.numeroCamas>1) features.push(`${q.numeroCamas} camas`);
  if(q.tipoCama) features.push(q.tipoCama);
  if(q.temBerco) features.push('Berço');
  const ativo=q.ativo!==false;
  return `
  <div class="quarto-card">
    <span class="quarto-type-badge ${tipoColors[tipo.toUpperCase()]||'badge-gray'}">${tipo}</span>
    <div class="quarto-price">R$ ${(q.valorBase||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}<span>/diária base</span></div>
    <div class="quarto-features">${features.map(f=>`<span class="feature-chip">${f}</span>`).join('')||'<span class="feature-chip">Padrão</span>'}</div>
    <div class="quarto-footer">
      <span class="badge ${ativo?'badge-green':'badge-red'}">${ativo?'Ativo':'Inativo'}</span>
      <div style="display:flex;gap:6px">
        ${ativo
          ?`<button class="btn btn-sm btn-outline" onclick="toggleQuarto(${q.id},false)">Desativar</button>`
          :`<button class="btn btn-sm btn-success" onclick="toggleQuarto(${q.id},true)">Ativar</button>`}
      </div>
    </div>
  </div>`;
}

async function toggleQuarto(id, ativar){
  try{
    await apiFetch(`/quartos/${id}/${ativar?'ativar':'desativar'}`,{method:'PATCH'});
    showToast(`Quarto ${ativar?'ativado':'desativado'}.`);
    loadQuartosByResidencia(selectedResidenciaId);
  }catch(e){showToast('Erro: '+e.message,true);}
}

function openNovoQuarto(){
  // Se a página ainda não carregou residências/tabs, tenta carregar antes do modal
  if((!_residencias || _residencias.length===0) && currentPage==='quartos'){
    // loadQuartos já cuida de setar selectedResidenciaId
    setTimeout(()=>{loadQuartos();},0);
  }

  showModal('Novo Quarto', quartoForm(), 'Criar', async ()=>{
    // Garante que existe uma residência selecionada antes de tentar criar quarto
    if(!selectedResidenciaId){
      try{
        if(!_residencias || _residencias.length===0){
          const res = await apiFetch('/residencias');
          _residencias = Array.isArray(res) ? res : [];
        }
        if(_residencias.length>0) selectedResidenciaId = _residencias[0].id;
      }catch(e){
        // deixa a mensagem abaixo tratar
      }
    }
    if(!selectedResidenciaId){showToast('Selecione uma residência.',true);return false;}
    const tipo=val('q-tipo');
    const body={
      tipo,valorBase:parseFloat(val('q-valor')),
      possuiAr:document.getElementById('q-ar')?.checked||false,
      possuiHidro:document.getElementById('q-hidro')?.checked||false,
      numeroCamas:parseInt(val('q-camas'))||1,
      tipoCama:val('q-tipocama')||null,
      temBerco:document.getElementById('q-berco')?.checked||false,
      camasSolteiro:parseInt(val('q-cs'))||0,
      camasCasal:parseInt(val('q-cc'))||0,
      camasQueenKing:parseInt(val('q-cq'))||0,
      numeroAmbientes:parseInt(val('q-amb'))||0,
    };
    if(!body.valorBase||isNaN(body.valorBase)){showToast('Informe o valor base.',true);return false;}
    await apiFetch(`/quartos/residencia/${selectedResidenciaId}`,{method:'POST',body:JSON.stringify(body)});
    showToast('Quarto criado!');
    loadQuartosByResidencia(selectedResidenciaId);
  });
  setTimeout(()=>{
    const sel=document.getElementById('q-tipo');
    if(sel) sel.addEventListener('change',()=>updateQuartoFormFields(sel.value));
    updateQuartoFormFields('INDIVIDUAL');
  },50);
}

function updateQuartoFormFields(tipo){
  document.getElementById('qf-individual').style.display=tipo==='INDIVIDUAL'?'':'none';
  document.getElementById('qf-duplo').style.display=tipo==='DUPLO'?'':'none';
  document.getElementById('qf-familia').style.display=tipo==='FAMILIA'?'':'none';
}

function showModal(title, content, actionLabel, onAction){
  const mc=document.getElementById('modal-container');
  if(!mc) return;
  mc.innerHTML=`
  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <div class="modal-head">
        <h2>${title}</h2>
        <button class="close-btn" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">${content}</div>
      ${actionLabel?`<div class="modal-foot">
        <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" id="modal-action-btn">${actionLabel}</button>
      </div>`:''}
    </div>
  </div>`;
  document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target.id==='modal-bg')closeModal();});
  if(actionLabel){
    document.getElementById('modal-action-btn').addEventListener('click', async ()=>{
      try{
        const result = await onAction();
        if(result!==false) closeModal();
      }catch(e){
        showToast('Erro: '+e.message,true);
      }
    });
  }
}

function closeModal(){
  const mc=document.getElementById('modal-container');
  if(mc) mc.innerHTML='';
}

function val(id){return document.getElementById(id)?.value||'';}

// ─── ATTACH PAGE EVENTS ──────────────────────────────────────────────────────
function attachPageEvents(){
  if(currentPage==='dashboard') loadDashboard();
  if(currentPage==='reservas'){
    loadReservas();
    document.getElementById('search-reserva')?.addEventListener('input',renderReservasFiltered);
  }
  if(currentPage==='clientes'){
    loadClientes();
    document.getElementById('search-cliente')?.addEventListener('input',renderClientesFiltered);
  }
  if(currentPage==='quartos') loadQuartos();
  if(currentPage==='residencias') loadResidencias();
}

// Expose functions to global scope for inline onclick handlers
window.navigate=navigate;
window.logout=logout;
window.openNovaReserva=openNovaReserva;
window.openNovoCliente=openNovoCliente;
window.openEditCliente=openEditCliente;
window.deletarCliente=deletarCliente;
window.openNovoQuarto=openNovoQuarto;
window.toggleQuarto=toggleQuarto;
window.openNovaResidencia=openNovaResidencia;
window.openEditResidencia=openEditResidencia;
window.deletarResidencia=deletarResidencia;
window.cancelarAluguel=cancelarAluguel;
window.verRecibo=verRecibo;
window.closeModal=closeModal;
window.selectResidencia=selectResidencia;
window.updateQuartoFormFields=updateQuartoFormFields;

render();
</script>
